<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart | NOVA Home</title>
<meta name="description" content="Review your cart.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="cart">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main"><div class="container pb-5">
  <div class="page-head"><nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Cart</li></ol></nav><h1>Your cart</h1></div>
  <div id="cart-empty" class="empty-state" hidden><i class="bi bi-bag" aria-hidden="true"></i><h2 class="h4">Your cart is empty</h2><p>Add a piece you like and it will show up here.</p><a class="btn btn-nova" href="shop.html">Start shopping</a></div>
  <div id="cart-filled" class="row g-4 g-lg-5" hidden>
    <div class="col-lg-8"><ul class="list-unstyled m-0 border-top" id="cart-lines"></ul><a class="btn btn-ghost mt-4" href="shop.html">Continue shopping</a></div>
    <div class="col-lg-4"><div class="summary"><h2 class="h5 mb-3">Order summary</h2>
      <div class="ship-progress" id="ship-progress" hidden>
        <p class="ship-progress__msg"><i class="bi bi-truck" id="ship-icon" aria-hidden="true"></i><span id="ship-msg"></span></p>
        <div class="ship-progress__track" id="ship-bar" role="progressbar" aria-label="Progress toward free delivery" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-describedby="ship-msg"><span class="ship-progress__fill" id="ship-fill"></span></div>
      </div>
      <div class="summary__row"><span>Subtotal</span><span id="sum-sub"></span></div>
      <div class="summary__row"><span>Delivery</span><span id="sum-del"></span></div>
      <div class="summary__row summary__total"><span>Total</span><span id="sum-total"></span></div>
      <p class="small text-muted-nova mt-2 mb-3" data-delivery-note>Free delivery on orders over EGP 1,500.</p>
      <a class="btn btn-nova w-100" href="checkout.html" id="cart-checkout">Proceed to checkout</a></div></div>
  </div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/settings.js"></script>
<script src="js/catalog.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
