<script>
(function() {
  document.addEventListener('auth:change', function(e) {
    var auth = e.detail;
    var nameEl = document.getElementById('wish-user-name');
    var emailEl = document.getElementById('wish-user-email');
    var avatarEl = document.getElementById('wish-avatar');
    var navEl = document.getElementById('wish-side-nav');
    if (auth && auth.authenticated && auth.customer) {
      if (nameEl) nameEl.textContent = auth.customer.name;
      if (emailEl) emailEl.textContent = auth.customer.email;
      if (avatarEl) {
        var parts = auth.customer.name.trim().split(/\s+/);
        var inits = parts[0] ? parts[0].charAt(0).toUpperCase() : 'C';
        if (parts.length > 1 && parts[parts.length - 1]) inits += parts[parts.length - 1].charAt(0).toUpperCase();
        avatarEl.textContent = inits;
      }
      if (navEl && !navEl.querySelector('.cust-logout-btn')) {
        var outLink = document.createElement('a');
        outLink.href = 'logout.php';
        outLink.className = 'cust-logout-btn text-danger';
        outLink.innerHTML = '<i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sign out</span>';
        navEl.appendChild(outLink);
      }
    }
  });
})();
</script>
